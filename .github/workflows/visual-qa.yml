name: FireRed visual QA
on:
  push:
    branches: [feat/firered-hack-base]
    paths: ['src/**', 'include/**', 'graphics/**', 'tools/**', 'Makefile', '.github/workflows/visual-qa.yml']
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev libmgba-dev python3-pil
      - name: Compile emulator capture tool before building the ROM
        run: |
          cc -Wall -Wextra -Werror tools/visual_qa/capture.c -o /tmp/firered-capture -lmgba
      - name: Check navigation for full and partial FireRed parties
        run: |
          cc -std=c99 -Wall -Wextra -Werror tools/visual_qa/test_grid.c -o /tmp/firered-grid-test
          /tmp/firered-grid-test
      - name: Validate and build isolated QA ROM
        run: |
          python3 tools/check_firered_battle_assets.py
          python3 tools/check_firered_ui_assets.py
          make clean
          make firered -j$(nproc) VISUAL_QA=1
      - name: Capture actual emulated screens
        run: |
          set -o pipefail
          mkdir -p visual-qa
          address=$(arm-none-eabi-nm pokefirered.elf | awk '$3 == "gVisualQaScene" {print $1}')
          progress=$(arm-none-eabi-nm pokefirered.elf | awk '$3 == "gVisualQaProgress" {print $1}')
          main=$(arm-none-eabi-nm pokefirered.elf | awk '$3 == "gMain" {print $1}')
          flags=$(arm-none-eabi-nm pokefirered.elf | awk '$3 == "gBattleTypeFlags" {print $1}')
          outcome=$(arm-none-eabi-nm pokefirered.elf | awk '$3 == "gBattleOutcome" {print $1}')
          test -n "$address"
          test -n "$progress"
          test -n "$main"
          arm-none-eabi-nm -n pokefirered.elf > visual-qa/symbols.txt
          /tmp/firered-capture pokefirered.gba visual-qa "$address" "$progress" "$main" "$flags" "$outcome" | awk '/^scene=/' | tee visual-qa/capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firered-visual-qa-screenshots
          path: visual-qa/
          if-no-files-found: error
